<!-- Trades Tab -->
<div id="tradesTab">
    <div class="empty-state empty-state-illustrated" id="emptyTrades">
        <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z" />
            </svg>
        </div>
        <h3 class="empty-state-title">Trade History</h3>
        <p class="empty-state-description">
            Your executed trades will appear here after running a backtest. Click any trade to highlight it on the
            chart.
        </p>
    </div>
    <div class="trades-summary" id="tradesSummary" style="display: none;">
        <div class="summary-item">
            <span class="summary-label">Win Rate</span>
            <span class="summary-value" id="tradesWinRate">0%</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Total PnL</span>
            <span class="summary-value" id="tradesTotalPnL">$0.00</span>
        </div>
    </div>
    <section class="backtest-diagnostics" id="backtestDiagnostics" style="display: none;">
        <div class="backtest-diagnostics__header">
            <div class="backtest-diagnostics__heading">
                <div class="backtest-diagnostics__title">Backtest Diagnostics</div>
                <div class="backtest-diagnostics__summary" id="backtestDiagnosticsSummary">No diagnostics yet.</div>
            </div>
            <button class="btn btn-secondary btn-compact" id="copyBacktestDiagnostics" type="button" disabled>
                Copy Diagnostics
            </button>
        </div>
        <div class="backtest-diagnostics__warnings" id="backtestDiagnosticsWarnings"></div>
        <div class="backtest-diagnostics__content" id="backtestDiagnosticsContent"></div>
    </section>
    <div class="trades-list" id="tradesList">
    </div>
</div>
