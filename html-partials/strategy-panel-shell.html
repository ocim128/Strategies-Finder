<div class="strategy-panel" id="strategyPanel">
    <div class="panel-resize-handle" id="panelResizeHandle"></div>
    <div class="panel-header">
        <span class="panel-title">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
            </svg>
            <span class="panel-title-text">Strategy Tester</span>
        </span>
        <div class="panel-actions">
            <details class="backtest-tools-menu" id="backtestToolsMenu">
                <summary class="backtest-tools-summary" title="Backtest tools" aria-label="Backtest tools">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="5" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="12" cy="19" r="2" />
                    </svg>
                </summary>
                <div class="backtest-tools-panel">
                    <div class="backtest-tools-heading">Backtest tools</div>
                    <button class="btn btn-secondary btn-compact backtest-tools-item" id="runBacktestEndpointPreview" type="button"
                        title="Run the latest regular UI backtest through the endpoint contract locally" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path
                                d="M13 3L4 14h6v7l9-11h-6z" />
                        </svg>
                        Preview Endpoint
                    </button>
                    <button class="btn btn-secondary btn-compact backtest-tools-item" id="copyBacktestEndpoint" type="button"
                        title="Copy the latest regular UI backtest as an endpoint request" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path
                                d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                        </svg>
                        Copy Endpoint
                    </button>
                </div>
            </details>
            <button class="btn btn-primary btn-compact run-btn" id="runBacktest" title="Run Backtest (Ctrl+Enter)">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <span class="run-btn-text">Run</span>
            </button>
        </div>
    </div>

    <div class="panel-body">
        <nav class="panel-navigation" aria-label="Strategy panel">
            <div class="panel-tabs" id="strategyTabs" role="tablist" aria-label="Strategy panel navigation">
                <button class="panel-tab active" data-tab="settings" data-shortcut="1" title="Alt+1" role="tab"
                    aria-selected="true">Settings</button>
                <button class="panel-tab" data-tab="results" data-shortcut="4" title="Alt+4" role="tab"
                    aria-selected="false">Results</button>
                <button class="panel-tab" data-tab="trades" data-shortcut="5" title="Alt+5" role="tab"
                    aria-selected="false">
                    Trades
                    <span class="badge" id="tradeBadge">0</span>
                </button>
                <button class="panel-tab" data-tab="finder" data-shortcut="2" title="Alt+2" role="tab"
                    aria-selected="false">Finder</button>
                <button class="panel-tab" data-tab="hunt" data-shortcut="8" title="Alt+8" role="tab"
                    aria-selected="false">Hunt</button>
                <button class="panel-tab" data-tab="batchbacktest" title="Batch Backtest" role="tab"
                    aria-selected="false">Batch</button>
                <button class="panel-tab" data-tab="ledgersweep" title="Ledger Sweep" role="tab"
                    aria-selected="false">Ledger Sweep</button>
            </div>
            <div class="panel-more">
                <button class="panel-more-trigger" id="panelMoreTrigger" type="button"
                    aria-haspopup="menu" aria-expanded="false" title="More tools">
                    <span id="panelMoreLabel">More</span>
                    <svg class="panel-more-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 10l5 5 5-5z" />
                    </svg>
                </button>
                <div class="panel-more-menu is-hidden" id="panelMoreMenu" role="menu">
                    <div class="panel-more-group">
                        <div class="panel-more-heading">Research &amp; validation</div>
                        <button type="button" role="menuitem" data-tab="walkforward" data-shortcut="3">Walk Forward</button>
                        <button type="button" role="menuitem" data-tab="montecarlo">Monte Carlo</button>
                        <button type="button" role="menuitem" data-tab="rankpairs">Rank Pairs</button>
                    </div>
                    <div class="panel-more-group">
                        <div class="panel-more-heading">Markets &amp; execution</div>
                        <button type="button" role="menuitem" data-tab="polymarket">Polymarket</button>
                        <button type="button" role="menuitem" data-tab="executionlab">Execution Lab</button>
                        <button type="button" role="menuitem" data-tab="datamining">Data Mining</button>
                        <button type="button" role="menuitem" data-tab="ibkrdata">IBKR Data</button>
                        <button type="button" role="menuitem" data-tab="cryptodata">Crypto Data</button>
                    </div>
                    <div class="panel-more-group">
                        <div class="panel-more-heading">Operations</div>
                        <button type="button" role="menuitem" data-tab="alerts">Alerts</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="panel-content" id="panelContent">
        </div>
    </div>
</div>
