<div id="strategydebuggerTab">
    <div class="section-title">Strategy Debugger</div>

    <div class="param-row">
        <div class="param-group">
            <label class="param-label" for="strategyDebuggerBaseline">Baseline</label>
            <select class="param-input" id="strategyDebuggerBaseline"></select>
        </div>
        <div class="param-group">
            <label class="param-label" for="strategyDebuggerMinScored">Min Scored</label>
            <input type="number" class="param-input" id="strategyDebuggerMinScored" value="100" min="0" step="1">
        </div>
    </div>

    <div class="param-row">
        <div class="param-group">
            <label class="param-label" for="strategyDebuggerSearch">Search</label>
            <input type="text" class="param-input" id="strategyDebuggerSearch" placeholder="Filter candidate strategies">
        </div>
        <div class="param-group">
            <label class="param-label" for="strategyDebuggerOnlyPolymarket1s">Polymarket 1s Only</label>
            <input type="checkbox" id="strategyDebuggerOnlyPolymarket1s" checked>
        </div>
    </div>

    <div class="section-body finder-strategy-toolbar">
        <div class="finder-strategy-actions" role="group" aria-label="Strategy debugger selection actions">
            <button class="btn btn-secondary btn-compact" id="strategyDebuggerSelectVisible" type="button">Visible</button>
            <button class="btn btn-secondary btn-compact" id="strategyDebuggerSelectNone" type="button">None</button>
        </div>
        <div class="finder-strategy-summary" id="strategyDebuggerStrategySummary">0 selected</div>
    </div>

    <div class="section-body strategy-list-container" id="strategyDebuggerStrategyList">
    </div>

    <div class="finder-actions">
        <button class="btn btn-primary run-btn" id="strategyDebuggerRun" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
            </svg>
            Run Debugger
        </button>
        <button class="btn btn-danger stop-btn" id="strategyDebuggerStop" style="display:none" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h12v12H6z" />
            </svg>
            Stop
        </button>
        <button class="btn btn-secondary" id="strategyDebuggerCopyDiagnostic" type="button" disabled>Copy Diagnostic JSON</button>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="strategyDebuggerProgressFill"></div>
        </div>
        <div class="progress-text" id="strategyDebuggerProgressText">Ready</div>
    </div>

    <div class="finder-status" id="strategyDebuggerStatus">Idle</div>

    <div class="finder-results">
        <div class="finder-header">
            <span>Verdict</span>
            <span>Strategy</span>
            <span>Delta</span>
        </div>
        <div class="empty-state empty-state-illustrated" id="strategyDebuggerEmpty">
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 3h6v2H9V3zm1 4h4v2h-4V7zm-3 4h10v10H7V11zm2 2v6h6v-6H9z" />
                </svg>
            </div>
            <h3 class="empty-state-title">No Debugger Run Yet</h3>
            <p class="empty-state-description">
                Select candidate strategies, run the debugger, then copy the diagnostic JSON into the feedback prompt.
            </p>
        </div>
        <div class="finder-list" id="strategyDebuggerResults"></div>
    </div>

    <div class="section-header">
        <div class="section-title">Diagnostic Output</div>
    </div>
    <div class="section-body">
        <pre class="debug-content" id="strategyDebuggerDiagnosticOutput">No diagnostic selected.</pre>
    </div>
</div>
