name: Strategies Finder test specs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and test specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: debug/playground/package-lock.json
      - run: npm ci --prefix debug/playground
      - run: npm run verify --prefix debug/playground/Strategies-Finder

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: debug/playground/package-lock.json
      - run: npm ci --prefix debug/playground
      - run: npm run test:e2e --prefix debug/playground/Strategies-Finder
