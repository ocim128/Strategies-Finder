name: Strategies Finder test specs

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'

jobs:
  unit:
    name: Typecheck and test specs
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      # `runner` is unavailable in job-level env, so the browser directory is
      # exported through GITHUB_ENV in a step context. Every consumer below —
      # the cache path, Puppeteer's browser install during `npm ci`, and the
      # specs' browser launch — reads this exact variable, on Windows and Linux.
      - name: Set Puppeteer cache directory and version
        id: puppeteer
        shell: bash
        run: |
          echo "PUPPETEER_CACHE_DIR=${RUNNER_TEMP}/puppeteer-cache" >> "$GITHUB_ENV"
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const lock = require('./package-lock.json');
          console.log(`version=${lock.packages['node_modules/puppeteer'].version}`);
          NODE
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: puppeteer-chrome-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.puppeteer.outputs.version }}-${{ hashFiles('.puppeteerrc.cjs') }}
      - run: npm ci
      - name: Restore test timing history
        uses: actions/cache/restore@v4
        with:
          # Only the scheduling history is restored; latest/ logs are never
          # treated as execution evidence.
          path: artifacts/test-logs/timings.json
          # The save key is unique per run (run id + attempt) because Actions
          # cache entries are immutable; the compatible restore prefix still
          # picks up the newest history so keys never freeze timing updates.
          # Keys separate runner OS, Node version, and the timing format
          # version the runner writes (formatVersion: 1). The explicit
          # actions/cache/save step below owns saving — actions/cache/restore
          # has no post-job save, so this cannot double-save.
          key: test-timings-v1-${{ runner.os }}-node22.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-timings-v1-${{ runner.os }}-node22.16.0-
      - run: npm run ci
      - name: Save refreshed test timing history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: artifacts/test-logs/timings.json
          key: test-timings-v1-${{ runner.os }}-node22.16.0-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Show failed spec logs
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summaryPath = 'artifacts/test-logs/latest/summary.json';
          if (fs.existsSync(summaryPath)) {
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            for (const result of summary.results.filter(result => result.status === 'FAIL')) {
              console.log(`::group::${result.file}`);
              if (result.logError) console.log(`Log unavailable or incomplete: ${result.logError}`);
              if (fs.existsSync(result.logFile)) console.log(fs.readFileSync(result.logFile, 'utf8'));
              else console.log('No log file available. See the runner output above.');
              console.log('::endgroup::');
            }
          }
          NODE

      - name: Upload failed spec evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-logs/latest/*.log
            artifacts/test-logs/latest/summary.json
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust engine format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
        with:
          components: rustfmt
      - name: Cache Cargo registry, index, git data, and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          # The dtolnay action's cachekey output pins the actual compiler
          # identity and host platform. Cargo.lock is part of the exact key;
          # the restore prefix keeps pre-change artifacts usable (cargo
          # rebuilds what changed) instead of evicting everything.
          key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('rust-engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-
      - run: cargo fmt --manifest-path rust-engine/Cargo.toml -- --check
      - run: cargo test --manifest-path rust-engine/Cargo.toml
      - run: cargo clippy --manifest-path rust-engine/Cargo.toml --all-targets -- -D warnings

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Same exported browser directory as the unit job, keyed separately by
      # OS so the Linux browser download is not shared with Windows.
      - name: Set Puppeteer cache directory and version
        id: puppeteer
        shell: bash
        run: |
          echo "PUPPETEER_CACHE_DIR=${RUNNER_TEMP}/puppeteer-cache" >> "$GITHUB_ENV"
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const lock = require('./package-lock.json');
          console.log(`version=${lock.packages['node_modules/puppeteer'].version}`);
          NODE
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PUPPETEER_CACHE_DIR }}
          key: puppeteer-chrome-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.puppeteer.outputs.version }}-${{ hashFiles('.puppeteerrc.cjs') }}
      - run: npm ci
      - run: npm run test:e2e
